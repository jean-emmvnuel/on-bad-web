# Vérification automatique du site à chaque push et pull request (plus la sécurité, voir « securite ») : lint, tests (mode démo, sans serveur), compilation.
name: Vérification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npx vitest run
      - name: Compilation
        run: npm run build

  # Sécurité (DevSecOps) : bloque si un secret, une dépendance vulnérable ou du code dangereux apparaît.
  # Outils figés à une version précise. Faux positifs : .gitleaksignore, .trivyignore, commentaire « nosemgrep » justifié.
  securite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique : un secret supprimé reste lisible dans les anciens commits
      - name: Secrets oubliés dans Git (Gitleaks)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.21.2
          curl -sSfLO "$base/gitleaks_8.21.2_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_8.21.2_checksums.txt"
          sha256sum -c --ignore-missing gitleaks_8.21.2_checksums.txt # empreinte officielle de la version
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks && rm gitleaks_8.21.2_*
          ./gitleaks git . --redact --no-banner --exit-code 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dépendances vulnérables (npm audit, production)
        run: npm audit --omit=dev --audit-level=high
      - name: Dépendances, secrets et configuration (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules
      - name: Code dangereux (Semgrep)
        run: |
          python3 -m pip install --quiet semgrep==1.97.0
          semgrep scan --config p/default --error --metrics=off --quiet --exclude node_modules
